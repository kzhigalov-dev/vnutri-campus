<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Обратная связь — внутри.</title>
<meta name="description" content="Вопросы по кабинетам и замечания к карте корпуса СПбГУПТД.">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./experience.css">
<link rel="stylesheet" href="./gallery.css">
<link rel="stylesheet" href="./navigator.css?v=20261106-ui2">
<link rel="stylesheet" href="./atlas-pages.css?v=20261106-ui2">
<script defer src="./vendor/email.min.js"></script>
<script type="module" src="./js/contact-form.js?v=20261106-ui2"></script>

<link rel="stylesheet" href="./campus-interface.css?v=20261112-maps"></head>
<body class="campus-page about-page feedback-page">
<header class="booking-header wrap">
  <a class="mini-brand" href="./index.html" aria-label="Внутри — к зданию">внутри<span>.</span><small>Карта кампуса</small></a>
  <a href="./index.html">К карте</a>
  <a href="./about.html">Кабинеты и источники</a>
  <a href="./index.html#bookings">Мои брони</a>
</header>

<main class="wrap feedback-main">
  <section class="feedback-intro" aria-labelledby="feedback-title">
    <h1 id="feedback-title">Написать нам</h1>
    <p class="lead">Нашли неточность на карте, хотите уточнить кабинет или предложить идею? Расскажите об этом.</p>
    <p class="feedback-address">СПбГУПТД<br>Вознесенский проспект, 44–46</p>
  </section>
  <div class="feedback-card">
    <form id="feedback-page-form" class="contact-form" novalidate>
      <div class="contact-grid">
        <label class="contact-label">
          <span>Ваше имя <b class="contact-req">*</b></span>
          <input type="text" name="user_name" id="page-contact-name" placeholder="Например: Иван Иванов" required autocomplete="name">
        </label>
        <label class="contact-label">
          <span>Email для ответа <b class="contact-req">*</b></span>
          <input type="email" name="user_email" id="page-contact-email" placeholder="student@sutd.ru" required autocomplete="email">
        </label>
      </div>

      <div class="contact-grid">
        <label class="contact-label">
          <span>Тема обращения</span>
          <select name="subject" id="page-contact-subject">
            <option value="Вопрос по аудитории">Вопрос по аудитории</option>
            <option value="Запрос на бронирование места">Запрос на бронирование места</option>
            <option value="Неточность в схеме или плане">Неточность в схеме или плане</option>
            <option value="Предложение по проекту">Предложение по проекту</option>
            <option value="Другое">Другое</option>
          </select>
        </label>
        <label class="contact-label">
          <span>Кабинет, если нужно</span>
          <input type="text" name="room" id="page-contact-room" placeholder="Например: 452">
        </label>
      </div>

      <label class="contact-label">
        <span>Сообщение <b class="contact-req">*</b></span>
        <textarea name="message" id="page-contact-message" rows="5" placeholder="Опишите ваш вопрос или замечание..." required></textarea>
      </label>

      <div id="page-contact-status" class="contact-status" role="status" hidden></div>

      <div class="contact-form-actions">
        <button type="submit" id="page-contact-submit-btn" class="nav-btn nav-btn-primary nav-btn-wide">
          <span id="page-contact-submit-text">Отправить сообщение</span>
        </button>
      </div>
    </form>
    <p class="feedback-service">Отправка через EmailJS. Укажите почту, на которую вам можно ответить.</p>
  </div>
</main>
</body>
</html>
